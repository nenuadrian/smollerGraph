<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>smollerGraph</title>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script type="module" src="graph.js"></script>
</head>
<body>
  <header>
    <h1>(smollerGraph)</h1>
    <form id="walk">
      <label>Walk from <input name="from" value="Red fox"></label>
      <label>along <input name="type" value="EATS"></label>
      <label>for <input name="hops" type="number" value="2" min="0" max="10">
        hops</label>
      <button>Walk</button>
      <output></output>
    </form>
  </header>
  <main>
    <svg id="graph">
      <defs>
        <!-- An arrowhead for relationships, drawn back from the line's end so
             it stops at the edge of the node's circle. -->
        <marker id="arrow" viewBox="0 -5 10 10" refX="38" markerWidth="10"
                markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M0,-5L10,0L0,5"></path>
        </marker>
      </defs>
    </svg>
    <aside id="inspector">
      <h2></h2>
      <p class="where"></p>
      <pre class="bytes"></pre>
      <h3>Relationships, newest first</h3>
      <ol></ol>
    </aside>
  </main>
</body>
</html>
