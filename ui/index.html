<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>smollerGraph</title>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="page.css">
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <h1>(smollerGraph)</h1>
    <form id="search">
      <input name="name" placeholder="Find a node by its name"
             autocomplete="off" spellcheck="false">
      <ul></ul>
    </form>
  </header>
  <aside id="queries">
    <form id="query">
      <textarea name="q" spellcheck="false">MATCH (s:Species)-[:PARENT_TAXON]->(g:Genus)-[:PARENT_TAXON]->(f {name: 'Canidae'}) RETURN s.name, g.name, f.name</textarea>
      <button>Run</button>
    </form>
    <h2>History</h2>
    <ol id="history"></ol>
  </aside>
  <main>
    <nav id="tabs">
      <button value="graph" class="active">Graph</button>
      <button value="table">Table</button>
      <button value="plan">Plan</button>
    </nav>
    <section id="graph" class="tab active">
      <canvas></canvas>
      <ul class="legend"></ul>
    </section>
    <section id="table" class="tab"><table></table></section>
    <section id="plan" class="tab"><pre></pre></section>
    <p id="status"></p>
  </main>
  <aside id="inspector">
    <h2></h2>
    <p class="label"></p>
    <button class="expand">Expand: draw where it leads</button>
    <p class="where"></p>
    <pre class="bytes"></pre>
    <h3>Properties, newest first</h3>
    <ol class="properties"></ol>
    <h3>Relationships, newest first</h3>
    <ol class="relationships"></ol>
  </aside>
</body>
</html>
