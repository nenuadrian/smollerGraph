# The licence is in LICENSE, at the top of the repo, so the files don't each
# start with a copy of it.
filter=-legal/copyright

# Each header guard is named after the header's path in include, such as
# SMOLLERGRAPH_GRAPH_H_.
root=include

# Google's style guide says not to use <filesystem>, and we do, as it makes
# and empties folders the same way on Linux, macOS and Windows.
filter=-build/c++17
