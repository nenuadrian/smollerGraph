name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the code style
        run: docker build --target lint .

      - name: Build and run the tests
        run: docker build --target test .

      - name: Build a project that uses the library
        run: docker build --target consumer .

      - name: Check the code with clang-tidy
        run: docker build --target tidy .

      # The API docs, with the explorer, built as WebAssembly, go up from the
      # public repository, where each episode arrives once it's out. The
      # private one, which spends Actions minutes, doesn't build them.
      - name: Build the API docs and the explorer
        if: ${{ !github.event.repository.private }}
        run: docker build --target docs --output site .

      - if: ${{ !github.event.repository.private }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Each push to the public repository's main publishes its API docs on GitHub
  # Pages, at https://nenuadrian.github.io/smollerGraph/, and the explorer at
  # https://nenuadrian.github.io/smollerGraph/explorer/.
  docs:
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
